name: Sync Shark CI

on:
  # Never add pull_request or pull_request_target: lane routing is push/dispatch only.
  push:
    branches:
      - 'claude-code/v2-*'
      - 'main'
      - 'ci/**'
      - 'quick/**'
  workflow_dispatch:

# One run per branch: a new commit cancels the run it supersedes.
concurrency:
  group: sync-shark-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Debug
  ZIG_ARCHIVE_SHA256: '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
  GITLEAKS_ARCHIVE_SHA256: 'cc47fdc0364964e2d346fbbcbe4cc87f34d490b2647508fb05930d0ec2fbff07'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Single home for suite CLI arguments: the tests shard matrix and the
  # quick-tests job both derive their invocation from this map, so a suite is
  # never called differently on the quick path. A suite takes the fixture root
  # as its next argument only when its selector appears in SUITE_ROOT_ARGS; a
  # suite that also needs trailing arguments declares them in SUITE_EXTRA_ARGS.
  SUITE_ROOT_ARGS: >-
    --v2-dropbox-checks --excluded-nested-pair-partition-checks --v2-local-journal-checks
    --cli-checks --cli-surface-checks --v2-store-gate-checks --v2-root-relist-scoped-checks
    --corresponding-included-overlap-checks --quarantine-checks --v2-resumelist-checks
    --v2-planning-protection-checks --v2-interrupted-delete-checks --v2-gap-checks
    --v2-snapshot-million-memory-checks --v2-storage-checks --fod-storage-checks
    --v2-recovery-query-checks --v2-recovery-first-restart-checks --v2-dates-checks
    --v2-local-offline-checks --v2-run-history-checks --v2-local-checks
    --v2-hotfix-gap-checks --v2-cached-identity-exclusion-checks --v2-journal-window-checks
    --v2-localwatch-checks --v2-download-kill-checks --v2-recovery-kill-checks
    --v2-recovery-audit --v2-slowdelete-checks --v2-heldperf-checks --v2-monitor-checks
    --v2-coverage-checks --v2-coverage-fix-checks --v2-mkdir-gate-checks
    --v2-provider-followups-checks --v2-dropbox-ignore-checks
    --v2-delete-review-notice-checks --v2-indexing-signal-checks
    --v2-gap-promotion-bound-checks
  SUITE_EXTRA_ARGS: '{"--v2-slowdelete-checks":["all"]}'

jobs:
  spec-inventory:
    name: spec inventory (non-gating)
    needs: select
    # D16: full integration-batch and RC runs only; a lane selection or quick run skips it.
    if: ${{ needs.select.outputs.has_selection != 'true' && !startsWith(github.ref, 'refs/heads/quick/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    # Gitleaks findings are triaged by the release coordinator at the going-public gate; this job never claims a clean-secret verdict.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
      - name: Install native build toolchain
        shell: pwsh
        run: ./tools/ci/Install-CiZig.ps1
      - name: Calibrate native tools and collect inventory
        shell: pwsh
        run: ./tools/ci/Test-SpecInventory.ps1 -Output "$env:RUNNER_TEMP/spec-inventory"
      - name: Retain native reports and merged SARIF even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-inventory
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/spec-inventory/*.sarif
            ${{ runner.temp }}/spec-inventory/*.xml
            ${{ runner.temp }}/spec-inventory/*.json
            ${{ runner.temp }}/spec-inventory/*.log
            ${{ runner.temp }}/spec-inventory/*.txt

  # Lane refs require a selection; integration and RC refs run the full matrix.
  # The file has four optional arrays: build (project keys), engine (Engine
  # check groups), core (Core.Tests switches) and ui (UiFixture selectors).
  select:
    name: select lane work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_selection: ${{ steps.read.outputs.has_selection }}
      build: ${{ steps.read.outputs.build }}
      engine: ${{ steps.read.outputs.engine }}
      engine_count: ${{ steps.read.outputs.engine_count }}
      core: ${{ steps.read.outputs.core }}
      core_count: ${{ steps.read.outputs.core_count }}
      ui: ${{ steps.read.outputs.ui }}
      ui_count: ${{ steps.read.outputs.ui_count }}
      needs_zig: ${{ steps.read.outputs.needs_zig }}
      runner: ${{ steps.read.outputs.runner }}
      core_runner: ${{ steps.read.outputs.core_runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs the step below against full, quick and focused fixtures, so hosted
      # executable groups cannot be silently omitted or duplicated.
      - name: Check full-run engine selection
        shell: pwsh
        run: ./tools/ci/check-lane-selection.ps1

      - name: Check shared check loop
        shell: pwsh
        run: ./tools/ci/Test-InvokeChecks.ps1

      - name: Read .ci-lane.json
        id: read
        shell: pwsh
        env:
          LANE_RUNNER: ${{ vars.SYNC_SHARK_LANE_RUNNER }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/ci/LaneSelection.ps1
          . ./tools/ci/EngineJobs.ps1
          $kind = Get-RunKind -Ref $env:GITHUB_REF
          $hostedOnly = @(Get-GroupList -Path 'tools/ci/hosted-only.txt')
          $knownBuild = @('core', 'core-tests', 'fod-tests', 'engine-tests', 'app', 'ui-fixture', 'reachability')
          $registry = Get-Content -Raw 'tests/SyncShark.Engine.Tests/CheckRegistry.cs'
          $registryGroups = (Get-CheckRegistryIndex -Text $registry).Groups
          $groups = @($registryGroups.Keys)
          if ($groups.Count -eq 0) { throw 'No engine groups found in CheckRegistry.' }
          $path = Join-Path $env:GITHUB_WORKSPACE '.ci-lane.json'
          $hasLane = Test-Path -LiteralPath $path -PathType Leaf
          if ($kind -eq 'lane' -and -not $hasLane) { throw 'A lane run needs .ci-lane.json (Invoke-LaneCi writes it); full runs use ci/int-* or ci/rc-*.' }
          if ($kind -eq 'full' -and $hasLane) { throw 'Integration and RC runs are full; remove .ci-lane.json (Invoke-LaneCi -Full does).' }
          if (-not $hasLane) {
            $build = @('core', 'core-tests', 'fod-tests', 'app', 'ui-fixture', 'reachability')
            $engine = @()
            if ($kind -eq 'quick') {
              $build = @('core', 'core-tests', 'fod-tests', 'app')
            } else {
              # A full run verifies every registered engine group, not only the projects above.
              $engine = $groups
              # Hosted runs cannot reach the live route; name those groups instead of scheduling them.
              # One owner for the list: tools/ci/live-groups.txt.
              $liveGroups = @(Get-GroupList -Path 'tools/ci/live-groups.txt')
              $skipped = @($engine | Where-Object { $liveGroups -ccontains $_ })
              if ($skipped.Count -gt 0 -and $env:GITHUB_STEP_SUMMARY) {
                'Full run: not run here: needs the authorized live route: ' + ($skipped -join ', ') |
                  Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
              $engine = @(Get-HostedGroups -Groups $registryGroups -Live $liveGroups)
              $build += 'engine-tests'
            }
            $data = [ordered]@{ has_selection = 'false'; build = $build; engine = $engine; core = @(); ui = @() }
          } else {
            $lane = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
            if ($null -eq $lane) { throw '.ci-lane.json is empty; list engine groups, core switches, ui selectors or build projects.' }
            $allowed = @('build', 'engine', 'core', 'ui')
            foreach ($name in $lane.PSObject.Properties.Name) {
              if ($allowed -cnotcontains $name) { throw "Unknown .ci-lane.json key '$name'; allowed: $($allowed -join ', ')." }
            }
            $readArray = {
              param([string]$Name)
              $property = $lane.PSObject.Properties[$Name]
              if ($null -eq $property -or $null -eq $property.Value) { return @() }
              $values = @($property.Value)
              foreach ($value in $values) {
                if ($value -isnot [string] -or [string]::IsNullOrWhiteSpace($value)) { throw ".ci-lane.json '$Name' must be an array of non-empty strings." }
              }
              return $values
            }
            $build = @(& $readArray 'build')
            $engine = @(& $readArray 'engine')
            $core = @(& $readArray 'core')
            $ui = @(& $readArray 'ui')
            foreach ($group in $engine) { if ($group -cnotmatch '^[a-z0-9]+(?:-[a-z0-9]+)*$') { throw "Invalid engine group '$group'." } }
            foreach ($flag in $core) { if ($flag -cnotmatch '^--[a-z0-9-]+$') { throw "Invalid core switch '$flag'." } }
            foreach ($selector in $ui) { if ($selector -cnotmatch '^[a-z0-9]+(?:-[a-z0-9]+)*$') { throw "Invalid ui selector '$selector'." } }
            foreach ($project in $build) { if ($knownBuild -cnotcontains $project) { throw "Unknown build project '$project'; allowed: $($knownBuild -join ', ')." } }
            $build = @(@('core','core-tests','fod-tests','engine-tests','app','ui-fixture') + $build | Select-Object -Unique)
            $data = [ordered]@{ has_selection = 'true'; build = $build; engine = $engine; core = $core; ui = $ui }
          }
          $data.engine = @(@(Get-MandatoryEngineGroups) + @($data.engine) | Select-Object -Unique)
          $data.build = @(@('core-tests', 'engine-tests') + @($data.build) | Select-Object -Unique)
          $data.engine = @(Expand-EngineGroups -Selected $data.engine -Groups $groups)
          # CI-JOBS-03: the measured longest indivisible core job is 1216 seconds.
          $jobs = @(Get-EngineJobs -Groups $data.engine -SecondsPath 'tools/ci/engine-group-seconds.txt' -TargetSeconds 1216)
          if ($env:GITHUB_STEP_SUMMARY) {
            $jobs | ForEach-Object { "Engine job: $($_.Groups -join ' ') weight=$($_.Weight)s" } |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          $runner = Get-RunnerLabels -RunKind $kind -EventName $env:EVENT_NAME -LaneRunner $env:LANE_RUNNER -Items @() -HostedOnly $hostedOnly
          $coreItems = if ($kind -eq 'quick') { @(Get-GroupList -Path 'ci-quick-suites.txt') } else { @($data.core) }
          $coreRunner = Get-RunnerLabels -RunKind $kind -EventName $env:EVENT_NAME -LaneRunner $env:LANE_RUNNER -Items $coreItems -HostedOnly $hostedOnly
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runner=$runner"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "core_runner=$coreRunner"
          # A matrix must not be empty; the count outputs keep the dummy out of a run.
          $matrix = {
            param($Values, $Sentinel)
            if ($Values.Count -eq 0) { return @($Sentinel) }
            return $Values
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "has_selection=$($data.has_selection)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "build=$((ConvertTo-Json -InputObject @($data.build) -Compress))"
          $engineJobs = @($jobs | ForEach-Object {
            [ordered]@{
              groups = $_.Groups -join ' '
              runner = @(Get-RunnerLabels -RunKind $kind -EventName $env:EVENT_NAME -LaneRunner $env:LANE_RUNNER -Items $_.Groups -HostedOnly $hostedOnly | ConvertFrom-Json)
            }
          })
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "engine=$((ConvertTo-Json -InputObject @(& $matrix $engineJobs ([ordered]@{ groups = '__none__'; runner = @('windows-latest') })) -Depth 4 -Compress))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "engine_count=$($data.engine.Count)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "core=$((ConvertTo-Json -InputObject @(& $matrix $data.core '__none__') -Compress))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "core_count=$($data.core.Count)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ui=$((ConvertTo-Json -InputObject @(& $matrix $data.ui '__none__') -Compress))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ui_count=$($data.ui.Count)"
          $needsZig = (@($data.build) -ccontains 'app') -or (@($data.build) -ccontains 'ui-fixture')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "needs_zig=$($needsZig.ToString().ToLowerInvariant())"

  setup-transitions:
    needs: select
    if: ${{ needs.select.outputs.has_selection != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup transitions on stock PowerShell
        shell: powershell
        run: ./tools/Test-SyncSharkSetup.ps1
      - name: Check setup as a standard user
        shell: powershell
        run: ./tools/Test-SyncSharkSetupUnelevated.ps1

  setup-cleanup-launch:
    needs: select
    if: ${{ needs.select.outputs.has_selection != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prove cleanup launch failure and silent mutant
        shell: pwsh
        run: ./tools/Test-SyncSharkSetupCleanupLaunch.ps1
      - name: Retain cleanup launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-cleanup-launch-evidence
          path: ${{ runner.temp }}/setup-mutants-cleanup-*/**/*.log

  setup-mutants:
    needs: setup-transitions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove setup assertions reject isolated mutants
        shell: powershell
        run: ./tools/Test-SyncSharkSetupMutants.ps1
      - name: Retain setup mutant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-mutant-evidence
          path: ${{ runner.temp }}/setup-mutants-*/**/*.log

  spec-ratchet:
    needs: literal-sites
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Release ownership configures the public tag and its public commit, not private SHAs.
      RATCHET_LIVE_TAG: ${{ vars.RATCHET_LIVE_TAG }}
      RATCHET_LIVE_COMMIT: ${{ vars.RATCHET_LIVE_COMMIT }}
    outputs:
      evidence: ${{ steps.ratchet.outputs.evidence }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch owner-pinned live release
        shell: pwsh
        run: |
          if ($env:RATCHET_LIVE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:RATCHET_LIVE_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            Write-Host 'INCOMPLETE: release owner must configure the public live tag and commit.'
            exit 2
          }
          foreach ($name in @('HTTPS_PROXY', 'HTTP_PROXY', 'ALL_PROXY')) {
            [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          git fetch --no-tags origin "refs/tags/$env:RATCHET_LIVE_TAG`:refs/tags/$env:RATCHET_LIVE_TAG"
          exit $LASTEXITCODE

      - name: Download literal permissions
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: literal-sites
          path: ${{ runner.temp }}

      - name: Check mandatory gate fixtures
        if: always()
        shell: pwsh
        run: |
          pwsh -File tools/ci/Test-MandatoryChecks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File tools/Test-PreReview.ps1 -SelfTest
          exit $LASTEXITCODE

      - name: Ratchet engineering-spec debt
        id: ratchet
        if: always()
        shell: pwsh
        run: |
          python -I tools/ci/test-spec-ratchet.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/ci/check-spec-ratchet.py --literal-sites "$env:RUNNER_TEMP/literal-sites.jsonl" | Tee-Object -Variable ratchetOutput
          $code = $LASTEXITCODE
          $ratchetOutput | Where-Object { $_ -match '^(POLICY REVIEW|TRUSTED RELEASE) ' } |
            ForEach-Object { "- $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $evidence = if ($code -eq 2) { 'incomplete' } elseif ($code -eq 0) { 'success' } else { 'failure' }
          "evidence=$evidence" >> $env:GITHUB_OUTPUT
          exit $code

  mandatory-checks:
    needs: [select, spec-ratchet, build-core, build-engine, lane-engine]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require completed ratchet and fences
        shell: pwsh
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          . ./tools/ci/MandatoryChecks.ps1
          $needs = $env:CHECK_RESULTS | ConvertFrom-Json -AsHashtable
          $results = @{}
          foreach ($name in $needs.Keys) { $results[$name] = $needs[$name].result }
          $results['trusted-release'] = $needs['spec-ratchet'].outputs.evidence
          $outcome = Get-MandatoryCheckOutcome -Results $results -Required @('select', 'spec-ratchet', 'build-core', 'build-engine', 'lane-engine', 'trusted-release')
          $summary = "SUMMARY $($outcome.State); incomplete=$($outcome.Incomplete -join ','); failed=$($outcome.Failed -join ',')"
          Write-Host $summary
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          exit $outcome.ExitCode

  # The former single build job is split by target so the engine lane starts as
  # soon as its own binaries exist, instead of waiting for the app/UI fixture.
  # Artifact names are unchanged, so the shard, lane and quick jobs need no edit.
  build-core:
    needs: select
    runs-on: ${{ fromJSON(needs.select.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Personal paths, account names and the owner's SID must never reach a
      # tracked file again; docs/ and AGENTS.md are excluded.
      - name: Reject personal literals
        shell: pwsh
        run: ./tools/ci/check-personal-literals.ps1

      - name: Check short-id prefix contracts
        shell: pwsh
        run: ./tools/ci/check-short-id-prefixes.ps1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build selected projects
        shell: pwsh
        env:
          BUILD_KEYS: ${{ needs.select.outputs.build }}
        run: ./tools/ci/build-projects.ps1 -Target core -Keys $env:BUILD_KEYS

      - name: Upload test binaries
        if: ${{ contains(fromJson(needs.select.outputs.build), 'core-tests') }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-shark-tests
          path: tests/SyncShark.Core.Tests/bin/${{ env.CONFIGURATION }}/net8.0
          if-no-files-found: error
          retention-days: 7

  build-engine:
    needs: select
    runs-on: ${{ fromJSON(needs.select.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject personal literals
        shell: pwsh
        run: ./tools/ci/check-personal-literals.ps1

      - name: Check short-id prefix contracts
        shell: pwsh
        run: ./tools/ci/check-short-id-prefixes.ps1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build selected projects
        shell: pwsh
        env:
          BUILD_KEYS: ${{ needs.select.outputs.build }}
        run: ./tools/ci/build-projects.ps1 -Target engine -Keys $env:BUILD_KEYS

      - name: Upload engine test binaries
        if: ${{ contains(fromJson(needs.select.outputs.build), 'engine-tests') }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-shark-engine-tests
          path: tests/SyncShark.Engine.Tests/bin/${{ env.CONFIGURATION }}/net8.0-windows
          if-no-files-found: error
          retention-days: 7

      # OwnershipChecks resolves engine types with the project's generated global
      # usings; a lane checkout has no obj\ tree, so the generated file travels.
      - name: Upload engine global usings
        if: ${{ contains(fromJson(needs.select.outputs.build), 'engine-tests') }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-shark-engine-usings
          path: src/SyncShark.Engine/obj/${{ env.CONFIGURATION }}/net8.0-windows/SyncShark.Engine.GlobalUsings.g.cs
          if-no-files-found: error
          retention-days: 7

  literal-sites:
    needs: build-engine
    runs-on: windows-latest
    env:
      RATCHET_LIVE_TAG: ${{ vars.RATCHET_LIVE_TAG }}
      RATCHET_LIVE_COMMIT: ${{ vars.RATCHET_LIVE_COMMIT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download engine test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-engine-tests
          path: tests/SyncShark.Engine.Tests/bin/${{ env.CONFIGURATION }}/net8.0-windows

      - name: Export literal permissions for candidate and pinned release
        shell: pwsh
        run: |
          foreach ($name in @('HTTPS_PROXY', 'HTTP_PROXY', 'ALL_PROXY')) {
            [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          git fetch --no-tags origin "refs/tags/$env:RATCHET_LIVE_TAG`:refs/tags/$env:RATCHET_LIVE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "import os, runpy; from pathlib import Path; runpy.run_path('tools/ci/spec_trust.py')['snapshot'](Path.cwd(), os.environ['RATCHET_LIVE_TAG'], os.environ['RATCHET_LIVE_COMMIT'], Path(os.environ['RUNNER_TEMP']) / 'literal-release')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "tests/SyncShark.Engine.Tests/bin/$env:CONFIGURATION/net8.0-windows/SyncShark.Engine.Tests.exe" --literal-sites $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/literal-release" "$env:RUNNER_TEMP/literal-sites.jsonl"
          exit $LASTEXITCODE

      - name: Upload literal permissions
        uses: actions/upload-artifact@v4
        with:
          name: literal-sites
          path: ${{ runner.temp }}/literal-sites.jsonl
          if-no-files-found: error
          retention-days: 7

  build-app:
    needs: select
    runs-on: ${{ fromJSON(needs.select.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject personal literals
        shell: pwsh
        run: ./tools/ci/check-personal-literals.ps1

      - name: Check short-id prefix contracts
        shell: pwsh
        run: ./tools/ci/check-short-id-prefixes.ps1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # apps/SyncShark builds native Explorer and Discovery helpers through the
      # pinned Zig 0.16.0 toolchain; the runner does not ship it. A selection
      # that builds only managed projects does not pay for it.
      - name: Install Zig 0.16.0
        if: ${{ needs.select.outputs.needs_zig == 'true' }}
        shell: pwsh
        run: ./tools/ci/Install-CiZig.ps1

      - name: Build selected projects
        shell: pwsh
        env:
          BUILD_KEYS: ${{ needs.select.outputs.build }}
        run: ./tools/ci/build-projects.ps1 -Target app -Keys $env:BUILD_KEYS

      # The ui jobs need the app plus the fixture and its copied helpers.
      # With these two paths the artifact root is build/ci/bin, so downloading it
      # there restores the layout the fixture resolves its sibling outputs from.
      - name: Upload UI fixture binaries
        if: ${{ contains(fromJson(needs.select.outputs.build), 'ui-fixture') }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-shark-ui-fixture
          path: |
            build/ci/bin/SyncShark/${{ env.CONFIGURATION }}
            build/ci/bin/SyncShark.UiFixture/${{ env.CONFIGURATION }}
          if-no-files-found: error
          retention-days: 7

      - name: Find conservative reachability candidates
        if: ${{ contains(fromJson(needs.select.outputs.build), 'reachability') }}
        shell: pwsh
        run: ./tools/ci/run-reachability.ps1

      - name: Upload reachability report
        if: ${{ always() && contains(fromJson(needs.select.outputs.build), 'reachability') }}
        uses: actions/upload-artifact@v4
        with:
          name: reachability-report
          path: ${{ runner.temp }}/reachability
          if-no-files-found: error
          retention-days: 7

  # Six measured shards retain every suite; dropbox and run remain indivisible.
  # Every shard attempts every suite and aggregates failures at the end.
  # Child processes (*-child), benchmarks/million-scale runs and suites that
  # need an F: drive or a manual selector stay out; suites already covered are not repeated.
  tests:
    name: tests (${{ matrix.label }})
    needs: [select, build-core]
    # quick/** runs one targeted quick-tests job instead of the full shard matrix;
    # a lane selection runs only its named jobs below.
    if: ${{ needs.select.outputs.has_selection != 'true' && !startsWith(github.ref, 'refs/heads/quick/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'core-1: dropbox'
            suites:
              - suite: dropbox
                flag: --v2-dropbox-checks
                drive: c
          - label: 'core-2: run'
            suites:
              - suite: run
                flag: --v2-run-checks
                drive: c # Includes the production rehearsal fixture, which needs native journal evidence.
          - label: 'core-3'
            suites:
              - suite: conflict-choices
                flag: --v2-conflict-choice-checks
                drive: c
              - suite: nested-pair
                flag: --excluded-nested-pair-partition-checks
                drive: c
              - suite: reincluded-evidence
                flag: --reincluded-evidence-checks
                drive: c
              # Real NTFS USN journal checks. runner.temp is on the runner's D:
              # volume, which has no usable journal; keep these roots on C:.
              - suite: local-journal
                flag: --v2-local-journal-checks
                drive: c
              # Takes no fixture root: it owns its short C: temp folders.
              - suite: atomic-file
                flag: --atomic-file-checks
                drive: c
              - suite: blockers
                flag: --blocker-checks
                drive: c
              - suite: cli
                flag: --cli-checks
                drive: c
              - suite: composition
                flag: --v2-composition-checks
                drive: c
          - label: 'core-4'
            suites:
              - suite: store-gate
                flag: --v2-store-gate-checks
                drive: c
              - suite: outcome-ownership
                flag: --v2-outcome-ownership-checks
                drive: c
              - suite: root-relist-scoped
                flag: --v2-root-relist-scoped-checks
                drive: c
              - suite: name-mapping
                flag: --v2-name-mapping-checks
                drive: c
              - suite: name-mapping-review
                flag: --v2-name-mapping-review-checks
                drive: c
              - suite: corresponding-overlap
                flag: --corresponding-included-overlap-checks
                drive: c
              - suite: quarantine
                flag: --quarantine-checks
                drive: c
              - suite: retry-protection
                flag: --retry-protection-checks
                drive: c
              - suite: first-sync-completion
                flag: --first-sync-completion-checks
                drive: c
              - suite: conflict-transition
                flag: --v2-conflict-transition-checks
                drive: c
              - suite: conflict-retirement
                flag: --v2-conflict-retirement-checks
                drive: c
              - suite: collision-baseline
                flag: --v2-collision-baseline-checks
                drive: c
              - suite: recovery-first-restart
                flag: --v2-recovery-first-restart-checks
                drive: c
              - suite: planner
                flag: --v2-planner-checks
                drive: c
              - suite: held
                flag: --v2-held-recovery
                drive: c
              - suite: notices
                flag: --v2-notice-restore-checks
                drive: c
              - suite: dates
                flag: --v2-dates-checks
                drive: c
              - suite: local-offline
                flag: --v2-local-offline-checks
                drive: c
              - suite: autosync
                flag: --v2-autosync-checks
                drive: c
              - suite: run-history
                flag: --v2-run-history-checks
                drive: c
              - suite: autosync-phase3
                flag: --v2-autosync-phase3-checks
                drive: c
              - suite: autosync-process
                flag: --v2-autosync-process-checks
                drive: c
              - suite: sync-host
                flag: --v2-host-checks
                drive: c
              - suite: review-deletes
                flag: --v2-review-deletes-checks
                drive: c
              - suite: recovery-audit
                flag: --v2-recovery-audit
                drive: c
              # A case argument is required; "all" runs every delete-recovery case.
              - suite: slowdelete
                flag: --v2-slowdelete-checks
                drive: c
              - suite: heldperf
                flag: --v2-heldperf-checks
                drive: c
              - suite: monitor
                flag: --v2-monitor-checks
                drive: c
              - suite: dropboxwatch
                flag: --v2-dropboxwatch-checks
                drive: c
          - label: 'core-5'
            suites:
              # These use real NTFS journal evidence, so their roots stay on C:
              # (runner.temp is on the runner's D: volume, which has no journal).
              - suite: local
                flag: --v2-local-checks
                drive: c
              - suite: hotfix-gap
                flag: --v2-hotfix-gap-checks
                drive: c
              - suite: cached-identity-exclusions
                flag: --v2-cached-identity-exclusion-checks
                drive: c
              - suite: journal-windows
                flag: --v2-journal-window-checks
                drive: c
              - suite: settle-planning
                flag: --v2-settle-planning-checks
                drive: c
              - suite: settle-window-million
                flag: --v2-settle-window-million-checks
                drive: c
              - suite: ignored-child
                flag: --v2-ignored-child-checks
                drive: c
              - suite: localwatch
                flag: --v2-localwatch-checks
                drive: c
              # Both parents launch *-child helper processes from the test exe;
              # the child flags themselves are never shard entries.
              - suite: download-kill
                flag: --v2-download-kill-checks
                drive: c
              - suite: recovery-kill
                flag: --v2-recovery-kill-checks
                drive: c
              - suite: coverage
                flag: --v2-coverage-checks
                drive: c
              - suite: coverage-fix
                flag: --v2-coverage-fix-checks
                drive: c
              - suite: mkdir-gate
                flag: --v2-mkdir-gate-checks
                drive: c
              - suite: provider-followups
                flag: --v2-provider-followups-checks
                drive: c
              - suite: dropbox-ignore
                flag: --v2-dropbox-ignore-checks
                drive: c
              - suite: delete-review-notice
                flag: --v2-delete-review-notice-checks
                drive: c
              - suite: narrowing
                flag: --v2-narrowing-checks
                drive: c
              - suite: contract
                flag: --v2-contract-checks
                drive: c
              - suite: setup-update
                flag: --setup-update-checks
                drive: c
              - suite: core-switch
                flag: --v2-core-switch-checks
                drive: c
              - suite: instrumentation
                flag: --v2-instrumentation-checks
                drive: c
              - suite: memory
                flag: --v2-memory-checks
                drive: c
              - suite: indexing-signal
                flag: --v2-indexing-signal-checks
                drive: c
              - suite: storage-unicode
                flag: --v2-storage-unicode-checks
                drive: c
              - suite: prepared-match-exclusion
                flag: --v2-prepared-match-exclusion-checks
                drive: c
              - suite: linked-exclusion-triple
                flag: --v2-linked-exclusion-triple-checks
                drive: c
              - suite: deferred-intake-bound
                flag: --v2-deferred-intake-bound-checks
                drive: c
              - suite: gap-promotion-handoff
                flag: --v2-gap-promotion-handoff-checks
                drive: c
              - suite: gap-promotion-bound
                flag: --v2-gap-promotion-bound-checks
                drive: c
          - label: 'core-6'
            suites:
              - suite: removal-review
                flag: --v2-removal-review-checks
                drive: c
              - suite: resumable-listing
                flag: --v2-resumelist-checks
                drive: c
              - suite: planning-protection
                flag: --v2-planning-protection-checks
                drive: c
              - suite: interrupted-delete
                flag: --v2-interrupted-delete-checks
                drive: c
              - suite: gap-verification
                flag: --v2-gap-checks
                drive: c
              - suite: snapshot-memory
                flag: --v2-snapshot-million-memory-checks
                drive: c
              - suite: prepare-memory
                flag: --v2-million-memory-checks
                drive: c
              - suite: storage
                flag: --v2-storage-checks
                drive: c
              - suite: files-on-demand-storage
                flag: --fod-storage-checks
                drive: c
              - suite: recovery-restore
                flag: --v2-recovery-restore-checks
                drive: c
              - suite: recovery-reader
                flag: --v2-recovery-reader-checks
                drive: c
              - suite: recovery-query
                flag: --v2-recovery-query-checks
                drive: c
              - suite: runcli
                flag: --v2-runcli-checks
                drive: c
              - suite: executor
                flag: --v2-executor-checks
                drive: c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-tests
          path: tests/SyncShark.Core.Tests/bin/${{ env.CONFIGURATION }}/net8.0

      - name: Run shard suites
        shell: pwsh
        env:
          SHARD_SUITES: '${{ toJSON(matrix.suites) }}'
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = $env:SHARD_SUITES | ConvertFrom-Json
          $exe = Join-Path $env:GITHUB_WORKSPACE "tests\SyncShark.Core.Tests\bin\$env:CONFIGURATION\net8.0\SyncShark.Core.Tests.exe"
          $items = @(foreach ($s in $suites) {
            # Journal suites need both explicit and temporary roots on C:.
            $base = if ($s.drive -eq 'c') { $env:LOCALAPPDATA } else { $env:RUNNER_TEMP }
            [ordered]@{
              name = $s.suite
              scratch = Join-Path $base "syncshark-ci\$($s.suite)-scratch"
              root = Join-Path $base "syncshark-ci\$($s.suite)-root"
              flag = $s.flag
            }
          })
          & ./tools/ci/Invoke-Checks.ps1 -Exe $exe -ItemsJson (ConvertTo-Json -InputObject $items) -Title 'Sync Shark CI shard results' -NameWidth 30
          exit $LASTEXITCODE

  # Packed engine jobs retain every selected group and aggregate item failures.
  # Core switches and UI selectors below remain focused-lane jobs.
  lane-engine:
    name: engine (${{ matrix.job.groups }})
    needs: [select, build-engine]
    if: ${{ needs.select.outputs.engine_count != '0' }}
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.select.outputs.engine) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download engine test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-engine-tests
          path: tests/SyncShark.Engine.Tests/bin/${{ env.CONFIGURATION }}/net8.0-windows

      # OwnershipChecks reads src/SyncShark.Engine/obj/**/*GlobalUsings.g.cs, which
      # only a build produces; without it the literals group fails on every lane.
      - name: Download engine global usings
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-engine-usings
          path: src/SyncShark.Engine/obj/${{ env.CONFIGURATION }}/net8.0-windows

      - name: Run engine groups
        shell: pwsh
        env:
          GROUPS: ${{ matrix.job.groups }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE "tests\SyncShark.Engine.Tests\bin\$env:CONFIGURATION\net8.0-windows\SyncShark.Engine.Tests.exe"
          $index = 0
          $items = @(foreach ($group in ($env:GROUPS -split ' ')) {
            # Short, separate roots retain SQLite headroom and usable journal evidence.
            [ordered]@{ name = $group; scratch = Join-Path $env:SystemDrive "ss\$index"; arguments = @('--engine-checks', $group) }
            $index++
          })
          & ./tools/ci/Invoke-Checks.ps1 -Exe $exe -ItemsJson (ConvertTo-Json -InputObject $items) -Title 'Sync Shark engine results' -NameWidth 30
          exit $LASTEXITCODE

  lane-core:
    name: core (${{ matrix.flag }})
    needs: [select, build-core]
    if: ${{ needs.select.outputs.core_count != '0' }}
    runs-on: ${{ fromJSON(needs.select.outputs.core_runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJson(needs.select.outputs.core) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-tests
          path: tests/SyncShark.Core.Tests/bin/${{ env.CONFIGURATION }}/net8.0

      - name: Run core switch
        shell: pwsh
        env:
          FLAG: ${{ matrix.flag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE "tests\SyncShark.Core.Tests\bin\$env:CONFIGURATION\net8.0\SyncShark.Core.Tests.exe"
          $name = $env:FLAG.TrimStart('-')
          $item = @{ name = $name; flag = $env:FLAG
            scratch = Join-Path $env:LOCALAPPDATA "syncshark-ci\lane-$name-scratch"
            root = Join-Path $env:LOCALAPPDATA "syncshark-ci\lane-$name-root" }
          & ./tools/ci/Invoke-Checks.ps1 -Exe $exe -ItemsJson (ConvertTo-Json -InputObject @($item)) -Title 'Core check' -NameWidth $name.Length
          exit $LASTEXITCODE

  lane-ui:
    name: ui (${{ matrix.selector }})
    needs: [select, build-core, build-app]
    if: ${{ needs.select.outputs.ui_count != '0' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        selector: ${{ fromJson(needs.select.outputs.ui) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Artifact root is build/ci/bin, so this restores
      # build/ci/bin/SyncShark/<configuration> and SyncShark.UiFixture/<configuration>.
      - name: Download UI fixture binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-ui-fixture
          path: build/ci/bin

      # The assembly selector resolves the focused core test assembly here.
      - name: Download core test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-tests
          path: build/ci/bin/SyncShark.Core.Tests/${{ env.CONFIGURATION }}/net8.0

      - name: Run UI selector
        shell: pwsh
        env:
          SELECTOR: ${{ matrix.selector }}
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector $env:SELECTOR

  # GUI/app checks from tests/SyncShark.UiFixture: the selectors that drive the
  # real WPF surfaces over isolated state (the *-ui-checks family plus the named
  # tray, window-close, settings-bridge, pair, endpoint and first-sync checks).
  # Checks that need installed state, live provider accounts, native Explorer,
  # a real display/DPI probe, a seeded database or a second fixture root stay
  # out. Each selector is its own step; every step records its outcome and the
  # final step fails the job after all checks have reported, like the shards.
  ui-tests:
    name: ui-tests
    needs: [select, build-core, build-app]
    if: ${{ needs.select.outputs.has_selection != 'true' && !startsWith(github.ref, 'refs/heads/quick/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Artifact root is build/ci/bin, so this restores
      # build/ci/bin/SyncShark/<configuration> and SyncShark.UiFixture/<configuration>.
      - name: Download UI fixture binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-ui-fixture
          path: build/ci/bin

      # Checks that load the focused core remote fixture resolve
      # build/ci/bin/SyncShark.Core.Tests/<configuration>/net8.0/SyncShark.Core.Tests.dll.
      - name: Download core test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-tests
          path: build/ci/bin/SyncShark.Core.Tests/${{ env.CONFIGURATION }}/net8.0

      - name: 'UI check: app settings bridge'
        id: ui-cli-settings
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector cli-settings-checks

      - name: 'UI check: iteration'
        id: ui-iteration
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector iteration-ui-checks

      - name: 'UI check: tray tooltip'
        id: ui-tray-tooltip
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector tray-tooltip-contract

      - name: 'UI check: window close'
        id: ui-window-close
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector window-close-contract

      - name: 'UI check: foundation'
        id: ui-foundation
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector ui-foundation-checks

      - name: 'UI check: workspace'
        id: ui-workspace
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector workspace-ui-checks

      - name: 'UI check: pairs'
        id: ui-pairs
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector pairs-ui-contract

      - name: 'UI check: activity account'
        id: ui-activity-account
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector activity-account-ui-checks

      - name: 'UI check: authorization pending'
        id: ui-authorization-pending
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector authorization-pending-ui-checks

      - name: 'UI check: endpoint hierarchy'
        id: ui-endpoint-hierarchy
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector endpoint-hierarchy-ui-checks

      - name: 'UI check: endpoint pair'
        id: ui-endpoint-pair
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector endpoint-pair-ui-checks

      - name: 'UI check: endpoint policy'
        id: ui-endpoint-policy
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector endpoint-policy-ui-checks

      - name: 'UI check: endpoint reversed'
        id: ui-endpoint-reversed
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector endpoint-reversed-ui-checks

      - name: 'UI check: endpoint review'
        id: ui-endpoint-review
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector endpoint-review-checks

      - name: 'UI check: endpoint location action'
        id: ui-endpoint-location
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector endpoint-location-action-checks

      - name: 'UI check: first sync context'
        id: ui-first-sync-context
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector first-sync-context-checks

      - name: 'UI check: first sync feedback'
        id: ui-first-sync-feedback
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector first-sync-feedback-checks

      - name: 'UI check: identity recovery'
        id: ui-identity-recovery
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector identity-recovery-ui-checks

      - name: 'UI check: local folder creation'
        id: ui-local-folder-creation
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector local-folder-creation-ui-checks

      - name: 'UI check: notice options'
        id: ui-notice-options
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector notice-options-ui-checks

      - name: 'UI check: pair storage'
        id: ui-pair-storage
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector pair-storage-ui-checks

      - name: 'UI check: recovery'
        id: ui-recovery
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector recovery-ui-checks

      - name: 'UI check: run history'
        id: ui-run-history
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector run-history-ui-checks

      - name: 'UI check: shared drive account'
        id: ui-shared-drive-account
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector shared-drive-account-ui-checks

      - name: 'UI check: source correction'
        id: ui-source-correction
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector source-ui-correction-checks

      - name: 'UI check: startup loading'
        id: ui-startup-loading
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector startup-loading-ui-checks

      # Takes the fixture root plus the focused core remote assembly.
      - name: 'UI check: mixed file retry'
        id: ui-mixed-file-retry
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector mixed-file-retry-ui-checks

      - name: 'UI check: pair failure presentation'
        id: ui-pair-failure
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector pair-failure-presentation-checks

      # The tray-client selector is carried by the tray feature's fixture. Run it wherever that
      # fixture exists and skip it on a tree that does not carry it, rather than failing the check.
      - name: 'UI check: tray client'
        id: ui-tray-client
        if: ${{ hashFiles('tests/SyncShark.UiFixture/TrayClientChecks.cs') != '' }}
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector tray-client-checks

      - name: 'UI check: engine startup readiness'
        id: ui-engine-startup-readiness
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci/Run-UiFixtureCheck.ps1 -Selector engine-startup-readiness-checks -Arguments none

      # Run every check before failing, so one red selector never hides the rest.
      - name: Enforce UI check results
        if: always()
        shell: pwsh
        env:
          UI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outcomes = $env:UI_STEP_OUTCOMES | ConvertFrom-Json
          $results = @()
          foreach ($property in $outcomes.PSObject.Properties) {
            if (-not $property.Name.StartsWith('ui-')) { continue }
            $results += [pscustomobject]@{ Step = $property.Name; Result = $property.Value.outcome }
          }
          Write-Host ""
          Write-Host "SUMMARY"
          Write-Host ("{0,-34} {1,-10}" -f 'STEP', 'RESULT')
          foreach ($result in $results) { Write-Host ("{0,-34} {1,-10}" -f $result.Step, $result.Result) }
          # A deliberately guarded selector that this tree does not carry is skipped, not failed;
          # every selector that actually runs must still succeed.
          # Known product stall, tracked in followups register; remove when fixed.
          # recovery-ui-checks still runs and prints its own FAIL line above; only this named step is
          # exempted from failing the job. Any other failing selector still fails it.
          $knownRed = @('ui-recovery')
          $knownRedFailed = @($results | Where-Object {
            $_.Result -ne 'success' -and $_.Result -ne 'skipped' -and $knownRed -contains $_.Step })
          $failed = @($results | Where-Object {
            $_.Result -ne 'success' -and $_.Result -ne 'skipped' -and $knownRed -notcontains $_.Step })
          foreach ($knownRedResult in $knownRedFailed) {
            Write-Host "KNOWN-RED $($knownRedResult.Step): product stall (followups register); does not fail the job."
          }
          Write-Host "TOTAL checks=$($results.Count) failed=$($failed.Count) known-red=$($knownRedFailed.Count)"

          if ($env:GITHUB_STEP_SUMMARY) {
            $md = @('## Sync Shark UI check results', '', '| Step | Result |', '| --- | --- |')
            foreach ($result in $results) { $md += "| $($result.Step) | $($result.Result) |" }
            $md += ''
            $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          if ($failed.Count -gt 0) { exit 1 }
          exit 0

  # Quick lane: the CI mirror writes ci-quick-suites.txt into the exported snapshot
  # (one CLI selector per line). One job runs just those suites with the same test
  # executable, C: scratch root, environment and SUITE_ROOT_ARGS/SUITE_EXTRA_ARGS
  # argument map the shards use, so a lane can prove a new suite in about ten minutes.
  quick-tests:
    name: quick-tests
    needs: [select, build-core]
    if: ${{ startsWith(github.ref, 'refs/heads/quick/') }}
    runs-on: ${{ fromJSON(needs.select.outputs.core_runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: sync-shark-tests
          path: tests/SyncShark.Core.Tests/bin/${{ env.CONFIGURATION }}/net8.0

      - name: Run quick suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE "tests\SyncShark.Core.Tests\bin\$env:CONFIGURATION\net8.0\SyncShark.Core.Tests.exe"
          $listPath = Join-Path $env:GITHUB_WORKSPACE 'ci-quick-suites.txt'
          if (-not (Test-Path -LiteralPath $listPath -PathType Leaf)) { throw 'ci-quick-suites.txt is missing from this quick snapshot.' }
          $selectors = @(Get-Content -LiteralPath $listPath | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($selectors.Count -eq 0) { throw 'ci-quick-suites.txt has no suite selectors.' }
          # The mirror validates this too; the workflow independently refuses anything else.
          $allowed = '^--[a-z0-9-]+-checks$'
          foreach ($selector in $selectors) {
            if ($selector -cnotmatch $allowed) { throw "Refusing suite selector '$selector'; expected --<name>-checks." }
          }
          if (-not (Test-Path -LiteralPath $exe)) { throw "Test executable not found: $exe" }

          $items = @(foreach ($suite in $selectors) {
            $suiteName = $suite.TrimStart('-')
            [ordered]@{
              name = $suite
              scratch = Join-Path $env:LOCALAPPDATA "syncshark-ci\quick-$suiteName-scratch"
              root = Join-Path $env:LOCALAPPDATA "syncshark-ci\quick-$suiteName-root"
              flag = $suite
            }
          })
          & ./tools/ci/Invoke-Checks.ps1 -Exe $exe -ItemsJson (ConvertTo-Json -InputObject $items) -Title 'Sync Shark quick suite results' -NameWidth 40
          exit $LASTEXITCODE
