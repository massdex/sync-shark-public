name: Lane Engine Checks

on:
  push:
    branches:
      - 'ci/140-lane'
      - 'ci/140-mutant'
      - 'ci/140-mutant-b'

env:
  CONFIGURATION: Debug
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  checks:
    name: engine (${{ matrix.check }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check:
          - exclusions
          - decide
          - syncer
          - live-wake
          - live-admission
          - stale-freshness
          - safety
          - store
          - dependencies
          - literals
          - attempt-cost
          - budget
          - containment
          - containment-move-out
          - dropbox
          - engine-host
          - folder-deletes
          - issues
          - live-run-core
          - local
          - mapped-holds
          - peer
          - released-history
          - repair
          - repair-claims
          - repair-direct
          - repair-forgotten
          - scan-owner
          - scan-pass
          - scope
          - speed
          - vocabulary
          - work-lifecycle
          - read-provider-speed
          - read-speed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build 'tests/SyncShark.Engine.Tests/SyncShark.Engine.Tests.csproj' -c $env:CONFIGURATION --nologo -p:NoWarn=CA1416
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "tests/SyncShark.Engine.Tests/bin/$env:CONFIGURATION" -Recurse -Filter 'SyncShark.Engine.Tests.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'Test executable not found after build.' }
          $scratch = Join-Path $env:SystemDrive 'ss'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $env:TEMP = $scratch
          $env:TMP = $scratch
          $env:SYNCSHARK_TEST_ROOT = $scratch
          & $exe.FullName --engine-checks '${{ matrix.check }}'
          exit $LASTEXITCODE
